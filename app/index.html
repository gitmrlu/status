async function start(){
  const{data,error}=await sb.from('items').select('*').order('updated_at',{ascending:false});
  if(error){$('#err').textContent=error.message;return}
  items=new Map(data.map(r=>[r.id,r]));
  ensureOffice();applyBots(true);resizeOffice();
  chan=sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
    if(p.eventType==='DELETE')items.delete(p.old.id);else items.set(p.new.id,p.new);
    applyBots(false);if(selectedBot)renderPanel(selectedBot);
  }).subscribe(s=>$('#live').classList.toggle('on',s==='SUBSCRIBED'));
}

function dubaiStamp(){
  try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' Dubai'}
  catch{return new Date().toISOString()}
}

function summarizeBots(){
  const map=new Map();
  for(const r of items.values()){
    let b=map.get(r.bot);if(!b){b={bot:r.bot,slug:r.slug,color:botColor(r.bot),counts:{},latest:null,activeLatest:null,items:[]};map.set(r.bot,b)}
    b.items.push(r);b.counts[r.status]=(b.counts[r.status]||0)+1;
    if(!b.latest||r.updated_at>b.latest)b.latest=r.updated_at;
    if(r.status!=='done'&&(!b.activeLatest||r.updated_at>b.activeLatest))b.activeLatest=r.updated_at;
    if(r.slug)b.slug=r.slug;
  }
  for(const b of map.values()){
    const c=b.counts;
    if(c.blocked_max)b.room='needs';
    else if(c.in_progress)b.room='desk';
    else if(c.waiting||c.paused||c.blocked_other)b.room='lounge';
    else b.room='idle';
    const ref=b.activeLatest||b.latest;
    b.stale=ref?(Date.now()-new Date(ref).getTime()>STALE_MS):true;
    b.active=b.items.filter(i=>i.status!=='done').sort((a,c)=>c.updated_at.localeCompare(a.updated_at));
  }
  return [...map.values()].sort((a,b)=>a.bot.localeCompare(b.bot));
}

function updateStats(bots){
  const n={needs:0,desk:0,lounge:0,idle:0,stale:0};
  for(const b of bots){n[b.room]++;if(b.stale)n.stale++}
  $('#stats').innerHTML=`
    <span class="stat" style="border-color:#f43f5e55"><b style="color:#f43f5e">${n.needs}</b> need you</span>
    <span class="stat" style="border-color:#3b82f655"><b style="color:#3b82f6">${n.desk}</b> working</span>
    <span class="stat" style="border-color:#a855f755"><b style="color:#a855f7">${n.lounge}</b> waiting</span>
    <span class="stat"><b>${n.idle}</b> idle</span>`;
}

function makeLabel(text,color='#e6e8ee',scale=1){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  g.clearRect(0,0,512,128);
  g.fillStyle='rgba(0,0,0,0.5)';g.beginPath();g.roundRect(12,36,488,56,14);g.fill();
  g.fillStyle=color;g.font='bold 34px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  let t=text;if(g.measureText(t).width>450){while(t.length>3&&g.measureText(t+'…').width>450)t=t.slice(0,-1);t+='…'}
  g.fillText(t,256,64);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(2.8*scale,0.7*scale,1);sp.center.set(0.5,0);return sp;
}
function floorLabel(text,color){
  const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');
  g.clearRect(0,0,1024,256);
  g.fillStyle='rgba(0,0,0,0.55)';g.beginPath();g.roundRect(40,60,944,136,24);g.fill();
  g.strokeStyle=color;g.lineWidth=8;g.stroke();
  g.fillStyle=color;g.font='bold 96px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(text,512,128);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.95,depthWrite:false});

}
function glowZone(w,d,color){
  const g=new THREE.Group();

  edge.rotation.x=-Math.PI/2;edge.position.y=0.015;g.add(edge);
  const inner=new THREE.Mesh(new THREE.PlaneGeometry(w-0.12,d-0.12),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.001}));

  const hole=new THREE.Mesh(new THREE.PlaneGeometry(w-0.2,d-0.2),new THREE.MeshStandardMaterial({color:0xc4a574,roughness:0.95,metalness:0}));
  hole.rotation.x=-Math.PI/2;hole.position.y=0.025;g.add(hole);
  const rim=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w,d)),new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9}));
  rim.rotation.x=-Math.PI/2;rim.position.y=0.04;g.add(rim);
  return g;
}
function box(w,h,d,color,opts={}){

  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  if(opts.x!=null)m.position.set(opts.x,opts.y??0,opts.z??0);
  return m;
}

function slotFor(room,index,total){
  const z=zoneMeshes[room];if(!z)return new THREE.Vector3(0,0,0);
  const cols=Math.max(2,Math.ceil(Math.sqrt(total*1.3)));
  const rows=Math.ceil(total/cols);
  const c=index%cols,r=Math.floor(index/cols);
  const x0=z.origin.x-z.w*0.35,z0=z.origin.z-z.d*0.3;
  const dx=z.w*0.7/Math.max(1,cols-1||1),dz=z.d*0.55/Math.max(1,rows-1||1);
  return new THREE.Vector3(x0+c*(cols===1?0:dx),0,z0+r*(rows===1?0:dz));
}

function makeActor(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.32),new THREE.MeshStandardMaterial({color,roughness:0.75}));
  body.position.y=0.55;g.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.38,0.38),new THREE.MeshStandardMaterial({color,roughness:0.7}));
  head.position.y=1.12;g.add(head);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.05,8,24),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.8,roughness:0.4}));
  ring.rotation.x=Math.PI/2;ring.position.y=0.06;g.add(ring);
  g.userData.body=body;g.userData.head=head;g.userData.ring=ring;
  return g;
}

function applyBots(instant){
  const bots=summarizeBots();
  updateStats(bots);
  const by={needs:[],desk:[],lounge:[],idle:[]};
  for(const b of bots)by[b.room].push(b);
  const seen=new Set();
  for(const room of ['needs','desk','lounge','idle']){
    const list=by[room];
    list.forEach((b,i)=>{
      seen.add(b.bot);
      let a=actors.get(b.bot);
      const target=slotFor(room,i,list.length);
      if(!a){
        const group=makeActor(b.color);
        group.userData.bot=b.bot;
        const label=makeLabel(b.bot);label.position.set(0,1.55,0);group.add(label);group.userData.label=label;
        group.position.copy(instant?target:new THREE.Vector3(0,0,8));
        root.add(group);
        a={group,target:target.clone(),room,color:b.color,stale:b.stale,bob:Math.random()*Math.PI*2,walk:0};
        actors.set(b.bot,a);
      }
      a.target.copy(target);a.room=room;a.stale=b.stale;a.color=b.color;
      if(instant)a.group.position.copy(target);
      // visuals
      const ringCol=ROOM_COL[room];
      a.group.userData.ring.material.color.setHex(ringCol);
      a.group.userData.ring.material.emissive.setHex(ringCol);
      a.group.userData.ring.material.emissiveIntensity=b.stale?0.15:1.1;
      const op=b.stale?0.35:1;
      a.group.userData.body.material.opacity=op;a.group.userData.body.material.transparent=b.stale;
      a.group.userData.head.material.opacity=op;a.group.userData.head.material.transparent=b.stale;
      // refresh label
      const old=a.group.userData.label;a.group.remove(old);if(old.material.map)old.material.map.dispose();old.material.dispose();
      const label=makeLabel(b.bot+(b.stale?' · stale':''), b.stale?'#94a3b8':'#e6e8ee');
      label.position.set(0,1.55,0);a.group.add(label);a.group.userData.label=label;
    });
  }
  for(const [name,a] of [...actors.entries()]){
    if(!seen.has(name)){root.remove(a.group);actors.delete(name);if(selectedBot===name){selectedBot=null;$('#officePanel').classList.remove('open');$('#officePanel').innerHTML=''}}
  }
}

function ensureOffice(){
  if(officeReady)return;
  const host=$('#officeCanvas');
  scene=new THREE.Scene();scene.background=new THREE.Color('#0b0d12');scene.fog=new THREE.Fog('#0b0d12',28,55);
  camera=new THREE.PerspectiveCamera(40,1,0.1,100);
  camera.position.set(16,14,18);
  renderer=new THREE.WebGLRenderer({antialias:!isMobile(),alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile()?1.5:2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  host.appendChild(renderer.domElement);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.06;
  controls.maxPolarAngle=Math.PI*0.46;controls.minDistance=10;controls.maxDistance=32;
  controls.enablePan=!isMobile();
  hemi=new THREE.HemisphereLight(0xffe4c4,0x1e293b,0.85);scene.add(hemi);
  dirLight=new THREE.DirectionalLight(0xfff1d6,1.05);dirLight.position.set(10,16,8);scene.add(dirLight);
  buildOffice();
  const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown',ev=>{
    const rect=renderer.domElement.getBoundingClientRect();
    pointer.x=((ev.clientX-rect.left)/rect.width)*2-1;
    pointer.y=-((ev.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(pointer,camera);
    const targets=[...actors.values()].map(a=>a.group);
    const hits=raycaster.intersectObjects(targets,true);
    if(!hits.length){selectedBot=null;$('#officePanel').classList.remove('open');$('#officePanel').innerHTML='';return}
    let obj=hits[0].object;while(obj&&!(obj.userData&&obj.userData.bot))obj=obj.parent;
    if(obj&&obj.userData.bot){selectedBot=obj.userData.bot;renderPanel(selectedBot)}
  });
  window.addEventListener('resize',resizeOffice);resizeOffice();
  officeReady=true;
  setTod(localStorage.tod||'evening');
  let last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    animateActors(dt,now/1000);
    controls.update();
    renderer.render(scene,camera);
  })(performance.now());
}

function animateActors(dt,t){
  for(const a of actors.values()){
    const g=a.group;
    const dx=a.target.x-g.position.x,dz=a.target.z-g.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist>0.04){
      const speed=Math.min(3.2,2.2+dist*0.4);
      const step=Math.min(dist,speed*dt);
      g.position.x+=dx/dist*step;g.position.z+=dz/dist*step;
      g.rotation.y=Math.atan2(dx,dz);
      // walk bob
      g.userData.body.position.y=0.55+Math.sin(t*14)*0.05;
      g.userData.head.position.y=1.12+Math.sin(t*14)*0.03;
      a.walk=1;
    }else{
      g.position.x=a.target.x;g.position.z=a.target.z;
      if(a.room==='desk'){
        // typing / working bob
        g.userData.body.position.y=0.55+Math.sin(t*6+a.bob)*0.03;
        g.userData.head.position.y=1.12+Math.sin(t*6+a.bob)*0.02;
        g.rotation.y=Math.PI; // face monitors (approx -z)
        a.group.userData.ring.material.emissiveIntensity=0.9+Math.sin(t*5)*0.25;
      }else if(a.room==='needs'){
        g.userData.body.position.y=0.55+Math.sin(t*3+a.bob)*0.02;
        a.group.userData.ring.material.emissiveIntensity=0.7+Math.sin(t*4)*0.5;
      }else{
        g.userData.body.position.y=0.55;
        g.userData.head.position.y=1.12;
        a.group.userData.ring.material.emissiveIntensity=a.stale?0.12:0.55;
      }
      a.walk=0;
    }
  }
}

function resizeOffice(){
  if(!renderer)return;const host=$('#officeCanvas');const w=host.clientWidth||1,h=host.clientHeight||1;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);
}

function setTod(mode){
  localStorage.tod=mode;
  document.querySelectorAll('.tod button').forEach(b=>b.classList.toggle('on',b.dataset.tod===mode));
  if(!skyMat)return;
  if(mode==='day'){skyMat.color.set(0x7dd3fc);skyMat.emissive.set(0x38bdf8);skyMat.emissiveIntensity=0.7;hemi.intensity=1.05;dirLight.intensity=1.2;dirLight.color.set(0xfff7ed);scene.background.set('#87a8c4');if(scene.fog)scene.fog.color.set('#87a8c4')}
  else if(mode==='evening'){skyMat.color.set(0xfdbA74);skyMat.emissive.set(0xfb923c);skyMat.emissiveIntensity=0.55;hemi.intensity=0.8;dirLight.intensity=0.95;dirLight.color.set(0xffd6a5);scene.background.set('#0b0d12');if(scene.fog)scene.fog.color.set('#0b0d12')}
  else{skyMat.color.set(0x1e3a5f);skyMat.emissive.set(0x1d4ed8);skyMat.emissiveIntensity=0.35;hemi.intensity=0.45;dirLight.intensity=0.45;dirLight.color.set(0xa5b4fc);scene.background.set('#05060a');if(scene.fog)scene.fog.color.set('#05060a')}
}
document.querySelectorAll('.tod button').forEach(b=>b.onclick=()=>setTod(b.dataset.tod));

function renderPanel(botName){
  const bots=summarizeBots();const b=bots.find(x=>x.bot===botName);
  const panel=$('#officePanel');if(!b){panel.classList.remove('open');panel.innerHTML='';return}
  panel.classList.add('open');
  const roomLabel={needs:'Needs Max office',desk:'Working at desk',lounge:'Lounge (waiting)',idle:'Break / idle'}[b.room];
  const list=(b.active.length?b.active:b.items.filter(i=>i.status==='done').slice(0,5));
  panel.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(b.bot)}</h2><button id="opClose" type="button">Close</button></div>
  <div class="sub">${esc(roomLabel)} · ${esc(b.slug||'—')} · ${b.latest?ago(b.latest)+' ago':'—'}${b.stale?' · <b>stale</b>':''}</div>
  <div class="soft">Ack / Decline write a note the bot reads on its next turn. They are <b>not</b> Grok Bot approval cards and do not send mail, spend money, or unblock anything by themselves.</div>
  ${list.map(r=>{
    const col=ST.find(s=>s[0]===r.status)?.[2]||'#9ca3af';
    const soft=r.status==='blocked_max'?`<div class="acts">
      <button class="ok" data-soft="ack" data-id="${r.id}">Ack (note)</button>
      <button class="danger" data-soft="decline" data-id="${r.id}">Decline (note)</button>
    </div>`:'';
    return`<div class="oc" style="--s:${col}"><div class="t">${esc(r.title)}</div>
    <div class="m"><span class="tag">${esc(r.status)}</span>${r.area?`<span class="tag">${esc(r.area)}</span>`:''}<span class="ts">${ago(r.updated_at)} ago</span></div>
    ${r.next?`<div class="n">${esc(r.next)}</div>`:''}${r.note?`<div class="note">📝 ${esc(r.note)}</div>`:''}${soft}</div>`}).join('')||'<p style="color:var(--mut)">No items.</p>'}`;
  $('#opClose').onclick=()=>{selectedBot=null;panel.classList.remove('open');panel.innerHTML=''};
}


$('#officePanel').addEventListener('click',async e=>{
  const btn=e.target.closest('[data-soft]');if(!btn)return;
  const id=btn.dataset.id,kind=btn.dataset.soft,r=items.get(id);if(!r)return;
  const stamp=dubaiStamp();
  const line=kind==='ack'
    ? `[Ack by Max ${stamp}] Soft acknowledgement only — bot should read this on its next turn.`
    : `[Declined by Max ${stamp}] Soft decline note only — bot should read this on its next turn.`;
  const note=r.note?`${r.note}\n${line}`:line;
  const nextExtra=kind==='ack'
    ? (r.next?`${r.next}\n[Max Ack ${stamp}]`:`[Max Ack ${stamp}] Soft ack noted in app`)
    : (r.next?`${r.next}\n[Max Declined ${stamp}]`:`[Max Declined ${stamp}] Soft decline noted in app`);
  btn.disabled=true;btn.textContent='Saving…';
  await upd(id,{note,next:nextExtra});
});
</script></body></html>
