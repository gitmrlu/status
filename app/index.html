function botAvatar(name){

    const key=Object.keys(BOT_AVATARS.byName).find(k=>k.toLowerCase()===String(name).toLowerCase());

  chan=sb.channel('items').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
    if(p.eventType==='DELETE')items.delete(p.old.id);else items.set(p.new.id,p.new);

function makeLabel(text,color='#94a3b8',scale=1,opts={}){
  // Bigger than v3 (~45%), plate tight to glyphs — overlap handled by stacking, not hiding
  const fontSize=Math.round(28*1.45);
  const padX=12, padY=6, maxText=440;
  const probe=document.createElement('canvas').getContext('2d');
  probe.font=`bold ${fontSize}px system-ui,sans-serif`;
  let t=String(text||'');
  if(probe.measureText(t).width>maxText){
    while(t.length>3&&probe.measureText(t+'…').width>maxText)t=t.slice(0,-1);
    t+='…';
  }
  const tw=Math.ceil(probe.measureText(t).width);
  const boxW=tw+padX*2, boxH=fontSize+padY*2;
  const c=document.createElement('canvas');
  c.width=Math.min(560, Math.max(48, boxW+4));
  c.height=Math.min(104, Math.max(28, boxH+4));
  const g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  g.font=`bold ${fontSize}px system-ui,sans-serif`;
  const bx=(c.width-boxW)/2, by=(c.height-boxH)/2;
  g.fillStyle='rgba(0,0,0,0.48)';
  g.beginPath();g.roundRect(bx,by,boxW,boxH,8);g.fill();
  g.fillStyle=color;g.textAlign='center';g.textBaseline='middle';
  g.fillText(t,c.width/2,c.height/2+0.5);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,opacity:opts.full?0.96:0.88}));
  const worldH=0.435*scale;
  const aspect=c.width/Math.max(1,c.height);
  const worldW=Math.min(1.95, worldH*aspect);
  sp.scale.set(worldW, worldH, 1);
  sp.center.set(0.5,0);
  return sp;
}

let usageBoardMesh=null, usageBoardTex=null, usageCountdownTimer=null;
function parseUsage(){
  for(const r of items.values()){
    if(!isUsageMeter(r))continue;
    try{
      const j=typeof r.next==='string'?JSON.parse(r.next):r.next;
      if(!j||typeof j!=='object')return null;
      if(typeof j.weekly_used_pct!=='number')return null;
      return j;
    }catch{return null}
  }
  return null;
}
function fmtDubai(iso,{withWeekday=false}={}){
  try{
    const d=new Date(iso);
    if(Number.isNaN(d.getTime()))return null;
    const opts=withWeekday
      ?{timeZone:'Asia/Dubai',weekday:'short',hour:'numeric',minute:'2-digit',hour12:true}
      :{timeZone:'Asia/Dubai',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true};
    return new Intl.DateTimeFormat('en-US',opts).format(d)+' Dubai';
  }catch{return null}
}
function fmtCountdown(iso){
  const t=new Date(iso).getTime()-Date.now();
  if(!Number.isFinite(t))return '';
  if(t<=0)return 'resetting now';
  const s=Math.floor(t/1000), d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
  if(d>0)return d+'d '+h+'h left';
  if(h>0)return h+'h '+m+'m left';
  return m+'m left';
}
function paintUsageCanvas(j){
  const c=document.createElement('canvas');c.width=768;c.height=512;const g=c.getContext('2d');
  g.fillStyle='#0b1220';g.fillRect(0,0,768,512);
  g.strokeStyle='#38bdf8';g.lineWidth=6;g.strokeRect(10,10,748,492);
  g.fillStyle='#7dd3fc';g.font='bold 36px system-ui,sans-serif';g.fillText('WEEKLY USAGE',36,64);
  if(!j){
    g.fillStyle='#94a3b8';g.font='28px system-ui,sans-serif';g.fillText('No reading yet',36,160);
    return c;
  }
  const left=Math.max(0,Math.min(100,100-j.weekly_used_pct));
  g.fillStyle='#e2e8f0';g.font='bold 72px system-ui,sans-serif';g.fillText(left.toFixed(left%1?1:0)+'% left',36,150);
  // bar
  g.fillStyle='#1e293b';g.fillRect(36,180,696,28);
  const bw=696*(left/100);
  const grd=g.createLinearGradient(36,0,36+bw,0);grd.addColorStop(0,'#38bdf8');grd.addColorStop(1,'#22c55e');
  g.fillStyle=grd;g.fillRect(36,180,bw,28);
  const resetLbl=fmtDubai(j.weekly_resets,{withWeekday:true});
  g.fillStyle='#bae6fd';g.font='26px system-ui,sans-serif';
  g.fillText(resetLbl?('resets '+resetLbl):'resets —',36,250);
  g.fillStyle='#94a3b8';g.font='22px system-ui,sans-serif';

  const odU=Number(j.ondemand_used), odL=Number(j.ondemand_limit);
  g.fillStyle='#e2e8f0';g.font='bold 28px system-ui,sans-serif';
  g.fillText('On-demand  $'+(Number.isFinite(odU)?odU:0)+' / $'+(Number.isFinite(odL)?odL:0),36,360);
  const asof=fmtDubai(j.as_of);

}

function updateUsageBoard(){

  // HUD (always readable)

  if(body){
    if(!j){body.innerHTML='<span class="muted">No reading yet</span>';}
    else{

function slotFor(room,index,total,bot){
  // Department desk: place in that bot's department zone
  if(room==='desk'&&bot){
    const meta=BOT_DEPTS.byName[bot.bot]||BOT_DEPTS.byName[bot]||null;
    const zkey=meta&&meta.zone;
    const z=zkey&&zoneMeshes[zkey];
    if(z){
      const cols=Math.max(2,Math.ceil(Math.sqrt(Math.max(total,2)*1.4)));
      const rows=Math.ceil(total/cols)||1;
      const c=index%cols,r=Math.floor(index/cols);
      const x0=z.origin.x-z.w*0.35,z0=z.origin.z-z.d*0.3;
      const dx=z.w*0.7/Math.max(1,cols-1), dz=z.d*0.55/Math.max(1,rows-1);
      return new THREE.Vector3(x0+c*(cols===1?0:dx),0,z0+r*(rows===1?0:dz));
    }
  }
  if(room==='lead'){
    const z=zoneMeshes.lead||{origin:new THREE.Vector3(2.5,0,-6.8),w:5.0,d:4.2};
    return new THREE.Vector3(z.origin.x,0,z.origin.z);
  }
  const z=zoneMeshes[room];if(!z)return new THREE.Vector3(0,0,0);
  const cols=room==='needs'
    ? Math.max(5, Math.ceil(Math.sqrt(total*2.2)))
    : Math.max(2, Math.ceil(Math.sqrt(total*1.3)));
  const rows=Math.ceil(total/cols)||1;
  const c=index%cols,r=Math.floor(index/cols);
  const marginX=room==='needs'?0.42:0.35, marginZ=room==='needs'?0.38:0.3;
  const spanX=room==='needs'?0.84:0.7, spanZ=room==='needs'?0.72:0.55;
  const x0=z.origin.x-z.w*marginX,z0=z.origin.z-z.d*marginZ;
  const dx=z.w*spanX/Math.max(1,cols-1), dz=z.d*spanZ/Math.max(1,rows-1);
  return new THREE.Vector3(x0+c*(cols===1?0:dx),0,z0+r*(rows===1?0:dz));
}

function applyBots(instant){
  const bots=summarizeBots();
  updateStats(bots);
  updateUsageBoard();
  const by={needs:[],lead:[],desk:[],lounge:[],idle:[]};
  for(const b of bots)by[b.room].push(b);
  const seen=new Set();
  for(const room of ['needs','lead','desk','lounge','idle']){
    const list=by[room];
    list.forEach((b,i)=>{
      seen.add(b.bot);
      let a=actors.get(b.bot);
      const target=slotFor(room,i,list.length,b);
      if(!a){

const _cutTmp=new THREE.Vector3();
function updateCutaway(){
  if(!cutawayWalls.length||!camera)return;
  for(const w of cutawayWalls){
    if(w.isGlass)continue; // meeting-room glass never cut away
    // Outward normal faces camera → wall is between viewer and room → fade it
    w.mesh.getWorldPosition(_cutTmp);
    const toCam=camera.position.clone().sub(_cutTmp).normalize();
    const facing=w.normal.dot(toCam);
    // Sims-style: hide walls whose outward normal faces the camera
    const want=facing>0.02 ? 0 : w.baseOpacity;
    const mat=w.mesh.material;
    mat.opacity += (want-mat.opacity)*0.28;
    mat.transparent=true;
    mat.depthWrite = mat.opacity>0.55;
    if(facing>0.02){mat.opacity=0;mat.visible=false;mat.depthWrite=false;}
    else{mat.visible=true;}
    // Keep sky materials emissive readable when visible
    if(w.sky && mat.emissiveIntensity!=null){/* no-op */}
  }
}
function ensureLabelLeader(a, toX, toY){
  let line=a.group.userData.leader;
  const fromY=1.32;
  if(!line){
    const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,fromY,0), new THREE.Vector3(toX,toY,0)]);
    line=new THREE.Line(geo, new THREE.LineBasicMaterial({color:0xcbd5e1, transparent:true, opacity:0.4, depthTest:false}));
    line.renderOrder=4;
    a.group.add(line);
    a.group.userData.leader=line;
  }else{
    const arr=line.geometry.attributes.position.array;
    arr[0]=0;arr[1]=fromY;arr[2]=0;arr[3]=toX;arr[4]=toY;arr[5]=0;
    line.geometry.attributes.position.needsUpdate=true;
  }
  line.visible=toY>1.9 || Math.abs(toX)>0.08;
  return line;
}
function layoutLabelGroup(group){
  group.sort((p,q)=>(p.x-q.x)||(p.z-q.z)||p.name.localeCompare(q.name));
  group.forEach((row,i)=>{
    const inNeeds=row.room==='needs';
    if(!inNeeds && !row.force && row.dist>48){
      row.lab.visible=false;
      if(row.a.group.userData.leader)row.a.group.userData.leader.visible=false;
      return;
    }
    row.lab.visible=true;
    row.lab.material.opacity=row.force?0.96:0.88;
    const step=inNeeds?0.55:0.48;
    const stackY=1.68 + i*step;
    const stackX=(i===0)?0: ((i%2)?1:-1)*0.28*Math.ceil(i/2);
    row.lab.position.set(stackX, stackY, 0);
    ensureLabelLeader(row.a, stackX, stackY);
  });
}
function updateLabelVisibility(){
  // Show ALL names. Overlap → vertical stacks + offset leaders (never hide Needs Max).
  if(!camera)return;
  const rows=[];
  for(const a of actors.values()){
    const lab=a.group.userData.label;if(!lab)continue;
    const name=a.group.userData.bot;
    const force=name===hoveredBot||name===selectedBot||a.summoned;
    const dist=camera.position.distanceTo(a.group.position);
    rows.push({a,lab,name,force,dist,room:a.room,x:a.group.position.x,z:a.group.position.z});
  }
  // Needs Max: one shared stack so the meeting-room cluster doesn't pile plates
  const needs=rows.filter(r=>r.room==='needs');
  const rest=rows.filter(r=>r.room!=='needs');
  layoutLabelGroup(needs);
  const cells=new Map();
  for(const row of rest){
    const key=(Math.round(row.x/1.6))+'_'+(Math.round(row.z/1.6));
    if(!cells.has(key))cells.set(key,[]);
    cells.get(key).push(row);
  }
  for(const group of cells.values())layoutLabelGroup(group);
}
function animateActors(dt,t){
  // research screen animations
  for(const s of researchScreens){if(s.tick)s.tick(t)}
  // blink server racks
  if(root&&root.userData.racks){
    for(const rk of root.userData.racks){
      rk.material.emissiveIntensity=0.2+Math.max(0,Math.sin(t*rk.userData.blink+rk.userData.phase))*0.9;
    }
  }
  for(const a of actors.values()){
    const g=a.group;
    const ud=g.userData;
    const nowMs=performance.now();
    // Click wiggle (~0.5s) — only exception to no-bob; returns to exact rest
    if(a.wiggleUntil&&nowMs<a.wiggleUntil){
      const left=(a.wiggleUntil-nowMs)/500; // 1→0
      const k=1-left;
      const wiggle=Math.sin(nowMs*0.055+(a.wigglePhase||0))*0.28*Math.sin(Math.PI*k); // ease in-out
      g.rotation.z=wiggle;
      g.scale.set(1+Math.abs(wiggle)*0.12, 1-Math.abs(wiggle)*0.18, 1+Math.abs(wiggle)*0.08);
      if(ud.body)ud.body.rotation.z=-wiggle*0.5;
      a.walk=0;
      continue;
    }else if(a.wiggleUntil&&nowMs>=a.wiggleUntil){
      a.wiggleUntil=0;
      g.rotation.z=0;g.scale.set(1,1,1);
      if(ud.body){ud.body.rotation.z=0;ud.body.position.y=0.62}
      if(ud.head)ud.head.position.y=1.18;
      if(a._postWiggleTarget){a.target.copy(a._postWiggleTarget);a._postWiggleTarget=null}
      else if(a.summoned&&maxDeskFront)a.target.copy(maxDeskFront);
    }
    const dx=a.target.x-g.position.x,dz=a.target.z-g.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist>0.05){
      const speed=Math.min(2.8,1.8+dist*0.35);
      const step=Math.min(dist,speed*dt);
      g.position.x+=dx/dist*step;g.position.z+=dz/dist*step;
      g.rotation.y=Math.atan2(dx,dz);
      // Real walk: swing legs/arms — not a slide
      const swing=Math.sin(t*12)*0.55;
      if(ud.legL){ud.legL.rotation.x=swing;ud.legR.rotation.x=-swing}
      if(ud.armL){ud.armL.rotation.x=-swing*0.7;ud.armR.rotation.x=swing*0.7}
      ud.body.position.y=0.62+Math.abs(Math.sin(t*12))*0.04;
      ud.head.position.y=1.18+Math.abs(Math.sin(t*12))*0.02;
      a.walk=1;
    }else{
      g.position.x=a.target.x;g.position.z=a.target.z;
      if(ud.legL){ud.legL.rotation.x=0;ud.legR.rotation.x=0}
      if(ud.armL){ud.armL.rotation.x=0;ud.armR.rotation.x=0}
      if(a.summoned&&maxStandPos){
        g.rotation.y=Math.atan2(maxStandPos.x-g.position.x, maxStandPos.z-g.position.z);
        ud.body.position.y=0.62;ud.head.position.y=1.18;
        ud.ring.material.emissiveIntensity=1.0+Math.sin(t*3)*0.25;
      }else if(a.room==='idle'||a.room==='lounge'){
        // Idle / lounge / break: NO bob — tags stay pinned
        ud.body.position.y=0.62;ud.head.position.y=1.18;
        ud.ring.material.emissiveIntensity=a.stale?0.1:0.45;
      }else if(a.room==='desk'||a.room==='lead'){
        ud.body.position.y=0.62+Math.sin(t*5+a.bob)*0.02;
        ud.head.position.y=1.18+Math.sin(t*5+a.bob)*0.015;
        g.rotation.y=a.room==='lead'?Math.PI*0.2:Math.PI;
        ud.ring.material.emissiveIntensity=0.85+Math.sin(t*4)*0.2;
      }else if(a.room==='needs'){
        ud.body.position.y=0.62;ud.head.position.y=1.18;
        ud.ring.material.emissiveIntensity=0.75+Math.sin(t*3.5)*0.35;
      }else{
        ud.body.position.y=0.62;ud.head.position.y=1.18;
      }
      a.walk=0;
    }
  }
}

    </div>`:(resolved?`<div class="m"><span class="tag" style="border-color:#22c55e55;color:#22c55e">${esc(rlab)}</span></div>`:'');
    return`<div class="oc" style="--s:${col}"><div class="t">${esc(r.title)}</div>
    <div class="m"><span class="tag">${esc(r.status)}</span>${rlab&&r.status==='blocked_max'?`<span class="tag" style="border-color:#22c55e55;color:#22c55e">${esc(rlab)}</span>`:''}${r.area?`<span class="tag">${esc(r.area)}</span>`:''}<span class="ts">${ago(r.updated_at)} ago</span></div>
    ${r.next?`<div class="n">${esc(r.next)}</div>`:''}${r.note?`<div class="note">📝 ${esc(r.note)}</div>`:''}${r.status==='blocked_max'&&!resolved?soft:''}</div>`}).join('')||'<p style="color:var(--mut)">No items.</p>'}`;
  $('#opClose').onclick=()=>{dismissSummon();selectedBot=null;panel.classList.remove('open');panel.innerHTML=''};
}


$('#officePanel').addEventListener('click',async e=>{
  const btn=e.target.closest('[data-soft]');if(!btn)return;
  const id=btn.dataset.id,kind=btn.dataset.soft,r=items.get(id);if(!r)return;
  const stamp=dubaiStamp();
  const line=kind==='ack'
    ? `[Ack by Max ${stamp}] Soft acknowledgement only — bot should read this on its next turn.`
    : `[Declined by Max ${stamp}] Soft decline note only — bot should read this on its next turn.`;
  const note=r.note?`${r.note}\n${line}`:line;
  const nextExtra=kind==='ack'
    ? (r.next?`${r.next}\n[Max Ack ${stamp}]`:`[Max Ack ${stamp}] Soft ack noted in app`)
    : (r.next?`${r.next}\n[Max Declined ${stamp}]`:`[Max Declined ${stamp}] Soft decline noted in app`);
  btn.disabled=true;btn.textContent='Saving…';
  await upd(id,{note,next:nextExtra});
  // Local mirror so Needs Max room updates immediately (status row unchanged)
  const cur=items.get(id);if(cur){cur.note=note;cur.next=nextExtra;cur.updated_at=new Date().toISOString();items.set(id,cur)}
  applyBots(false);if(selectedBot)renderPanel(selectedBot);
});


/* ===== Planners (private_docs via Supabase; never shipped in public Pages) ===== */
const PLANNER_IDS={
  'haskell-exit-plan':'Haskell Exit Plan',
  'jovia-golive-planner':'Jovia Go-Live'
};
let currentView='office';
const plannerCache=new Map(); // id -> html


function clearPlannerFrame(frame){
  if(!frame) return;
  if(frame._blobUrl){try{URL.revokeObjectURL(frame._blobUrl)}catch(e){} frame._blobUrl=null}
  frame.removeAttribute('srcdoc');
  frame.removeAttribute('src');
}
function mountPlannerHtml(frame, html){
  clearPlannerFrame(frame);
  // blob: URL inherits the app origin (unlike about:srcdoc opaque origin), so
  // planner localStorage keys (haskell-*, jovia-*) persist across reloads.
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  frame._blobUrl=URL.createObjectURL(blob);
  frame.src=frame._blobUrl;
}

function setView(view){
  currentView=view;
  document.querySelectorAll('#viewNav [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  const office=$('#officeWrap'), plan=$('#plannerWrap');
  if(view==='office'){
    plan.classList.remove('on');
    office.style.display='';
    // clear iframe to stop timers when leaving
    clearPlannerFrame($('#plannerFrame'));
    try{ resizeOffice(); }catch(e){}
    return;
  }
  office.style.display='none';
  plan.classList.add('on');
  loadPlanner(view);
}

async function loadPlanner(id){
  const st=$('#plannerStatus'), frame=$('#plannerFrame');
  st.classList.remove('err');
  st.textContent='Loading '+ (PLANNER_IDS[id]||id) +'…';
  clearPlannerFrame(frame);
  try{
    let html=plannerCache.get(id);
    if(!html){
      const{data,error}=await sb.from('private_docs').select('html,title,updated_at').eq('id',id).maybeSingle();
      if(error) throw error;
      if(!data||!data.html) throw new Error('Planner not found (signed in as Max?)');
      html=data.html;
      plannerCache.set(id,html);
      st.textContent=(data.title||PLANNER_IDS[id]||id)+' · updated '+(data.updated_at||'').slice(0,19).replace('T',' ')+' UTC';
    } else {
      st.textContent=(PLANNER_IDS[id]||id)+' · cached this session';
    }
    // blob URL + sandbox allow-same-origin: planner localStorage persists on the app origin
    mountPlannerHtml(frame, html);
  }catch(e){
    st.classList.add('err');
    st.textContent='Failed to load planner: '+(e.message||e);
  }
}

$('#viewNav').addEventListener('click',e=>{
  const b=e.target.closest('[data-view]'); if(!b) return;
  setView(b.dataset.view);
});

// Extra listener: wipe planner cache on sign-out
sb.auth.onAuthStateChange((_e,s)=>{
  if(!s){
    plannerCache.clear();
    clearPlannerFrame($('#plannerFrame'));
    currentView='office';
    document.querySelectorAll('#viewNav [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view==='office'));
    const office=$('#officeWrap'), plan=$('#plannerWrap');
    if(office) office.style.display='';
    if(plan) plan.classList.remove('on');
  }
});
